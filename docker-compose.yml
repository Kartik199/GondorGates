services:
  gondor-app:
    build: .
    container_name: gondor-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=gondor-redis
      - SPRING_DATA_REDIS_PORT=6379
      - BACKEND_URL=http://demo-backend:9090
    networks:
      - gondor-network
    depends_on:
      gondor-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  demo-backend:
    image: nginx:alpine
    container_name: demo-backend
    volumes:
      - ./demo-backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gondor-network

  gondor-redis:
    image: redis:7.2-alpine
    container_name: gondor-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - gondor_data:/data
    networks:
      - gondor-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gondor-prometheus:
    image: prom/prometheus:v2.52.0
    container_name: gondor-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - gondor-network
    depends_on:
      gondor-app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WARNING: Anonymous viewer access is enabled below for local demo convenience.
  # Anyone who can reach port 3000 can view all dashboards, including per-user bucket state.
  # Before deploying to any non-local environment: set GF_AUTH_ANONYMOUS_ENABLED=false
  # and set GRAFANA_ADMIN_PASSWORD to a strong value in your .env file.
  gondor-grafana:
    image: grafana/grafana:10.4.2
    container_name: gondor-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - gondor_grafana_data:/var/lib/grafana
    networks:
      - gondor-network
    depends_on:
      gondor-prometheus:
        condition: service_healthy

volumes:
  gondor_data:
  gondor_grafana_data:

networks:
  gondor-network:
    driver: bridge
