server:
  port: 8080

spring:
  application:
    name: gondorgates-limiter
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

gondorgates:
  policies:
    # 1. Strict Policy for Authentication
    - path: /api/login
      dimensions:
        - type: GLOBAL
          capacity: 100
          refillRate: 10
        - type: USER
          capacity: 5
          refillRate: 1

    # 2. Medium Policy for Orders
    - path: /api/orders
      dimensions:
        - type: GLOBAL
          capacity: 500
          refillRate: 50
        - type: USER
          capacity: 20
          refillRate: 5

    # 3. Test Policy for Integration Test (GondorGatesWebFilterIT)
    #    USER capacity=10 intentionally preserved to keep existing test assertions passing
    - path: /api/test
      dimensions:
        - type: GLOBAL
          capacity: 50
          refillRate: 5
        - type: USER
          capacity: 10
          refillRate: 2

    # 4. Default Catch-all
    - path: /
      dimensions:
        - type: GLOBAL
          capacity: 1000
          refillRate: 100
        - type: USER
          capacity: 100
          refillRate: 10