apiVersion: 1

groups:
  - orgId: 1
    name: GondorGates
    folder: GondorGates Alerts
    interval: 1m
    rules:
      - uid: gondor-redis-fail-open
        title: Redis Fail-Open Triggered
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: gondor-prometheus
            model:
              expr: rate(gondor_redis_errors_total[1m])
              refId: A
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Redis fail-open triggered — all rate limits suspended"
          description: "GondorGates cannot reach Redis. All requests are being allowed through regardless of configured rate limits. Check Redis health immediately."
        labels:
          severity: critical
        isPaused: false
